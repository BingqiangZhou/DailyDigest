name: Daily Digest

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30，考虑 ~30min 队列延迟后实际北京时间 ~8:00
  workflow_dispatch:
    inputs:
      source:
        description: '信息源'
        required: false
        default: 'tech'
        type: choice
        options:
          - tech
          - podcast
          - all

permissions:
  contents: write
  actions: read

concurrency:
  group: digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download processed articles tracker
        uses: actions/download-artifact@v4
        with:
          name: processed-articles
          path: workspace/
        continue-on-error: true

      - name: Download feed health tracker
        uses: actions/download-artifact@v4
        with:
          name: feed-health
          path: workspace/
        continue-on-error: true

      - name: Run Daily Digest
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          MODEL: ${{ secrets.MODEL }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          LLM_MAX_CONCURRENCY: "3"
        run: uv run python main.py --source ${{ github.event.inputs.source || 'all' }}

      - name: Upload processed articles tracker
        uses: actions/upload-artifact@v4
        with:
          name: processed-articles
          path: workspace/processed_articles.json
          retention-days: 90
        if: always()

      - name: Upload feed health tracker
        uses: actions/upload-artifact@v4
        with:
          name: feed-health
          path: workspace/feed_health.json
          retention-days: 90
        if: always()

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: digest-reports
          path: daily-digests/
          retention-days: 30
        if: always()

      - name: Commit and push reports
        run: |
          if [ -d "daily-digests" ] && [ "$(ls -A daily-digests)" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            # 先拉取远端最新（避免冲突）
            git pull --rebase --autostash || true
            # 判断是新增还是更新
            if git ls-files --error-unmatch daily-digests/**/*.md 2>/dev/null; then
              COMMIT_MSG="📝 Update digest report $(date +%Y-%m-%d)"
            else
              COMMIT_MSG="📄 Add digest report $(date +%Y-%m-%d)"
            fi
            git add -f daily-digests/
            git diff --cached --quiet || git commit -m "$COMMIT_MSG"
            git push
          else
            echo "No reports to commit"
          fi
