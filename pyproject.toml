[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[project]
name = "daily-digest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.10",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
scripts = ["requests>=2.31.0"]
dev = ["pytest>=7.0"]
